name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests for Xray
        run: npm run xray:test
        continue-on-error: true

      - name: Check Xray secrets presence
        if: always()
        shell: bash
        run: |
          if [ -z "${{ secrets.XRAY_CLIENT_ID }}" ]; then
            echo "XRAY_CLIENT_ID is empty"
          else
            echo "XRAY_CLIENT_ID is present"
          fi

          if [ -z "${{ secrets.XRAY_CLIENT_SECRET }}" ]; then
            echo "XRAY_CLIENT_SECRET is empty"
          else
            echo "XRAY_CLIENT_SECRET is present"
          fi

      - name: Get Xray token
        if: always()
        id: xray_auth
        shell: bash
        run: |
          RESPONSE=$(curl --silent --show-error -X POST "https://xray.cloud.getxray.app/api/v2/authenticate" \
            -H "Content-Type: application/json" \
            -d "{\"client_id\":\"${{ secrets.XRAY_CLIENT_ID }}\",\"client_secret\":\"${{ secrets.XRAY_CLIENT_SECRET }}\"}")

          echo "Raw response length: ${#RESPONSE}"

          TOKEN=$(echo "$RESPONSE" | tr -d '"')
          echo "Token length: ${#TOKEN}"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload results to Xray
        if: always()
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "Upload attempt $i"
            HTTP_CODE=$(curl --silent --show-error --write-out "%{http_code}" --output response.txt \
              -X POST "https://xray.cloud.getxray.app/api/v2/import/execution/junit" \
              -H "Authorization: Bearer ${{ steps.xray_auth.outputs.token }}" \
              -F "file=@playwright-report/results.xml")

            echo "HTTP status: $HTTP_CODE"
            cat response.txt || true

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "Upload to Xray succeeded"
              exit 0
            fi

            echo "Upload failed, waiting before retry..."
            sleep 15
          done

          echo "Upload to Xray failed after 3 attempts"
          exit 1

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
