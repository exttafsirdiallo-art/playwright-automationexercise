- name: Run Playwright tests for Xray
  run: npm run xray:test
  continue-on-error: true

- name: Get Xray token
  if: always()
  id: xray_auth
  shell: bash
  run: |
    TOKEN=$(curl -s -X POST "https://xray.cloud.getxray.app/api/v2/authenticate" \
      -H "Content-Type: application/json" \
      -d "{\"client_id\":\"${{ secrets.XRAY_CLIENT_ID }}\",\"client_secret\":\"${{ secrets.XRAY_CLIENT_SECRET }}\"}" | tr -d '"')
    echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

- name: Upload results to Xray
  if: always()
  shell: bash
  run: |
    curl -s -X POST "https://xray.cloud.getxray.app/api/v2/import/execution/junit" \
      -H "Authorization: Bearer ${{ steps.xray_auth.outputs.token }}" \
      -F "file=@playwright-report/results.xml"
